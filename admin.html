<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mpay Admin Control Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0a0512;
      --panel: rgba(20, 12, 34, 0.95);
      --border: rgba(168, 85, 247, 0.25);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --gold: #ffb703;
      --danger: #ff3366;
      --text: #f8fafc;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15), transparent 70%); padding: 15px; }

    .app-card { width: 100%; max-width: 440px; min-height: 700px; background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
    .brand { font-weight: 800; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

    .screen { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .hidden { display: none !important; }

    .box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .box-title { font-size: 0.9rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

    .input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; }
    .input:focus { border-color: var(--accent); }

    .btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-accent { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-gold { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; }
    .btn-glass { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(255, 51, 102, 0.15); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.3); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal-card { background: #120924; border: 1px solid var(--border); border-radius: 24px; padding: 25px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 0 40px var(--accent-glow); }
  </style>
</head>
<body>

  <!-- AUTH LOCK -->
  <div id="auth-modal" class="modal">
    <div class="modal-card">
      <i class="fa-solid fa-user-shield" style="font-size: 2.8rem; color: var(--accent); margin-bottom: 12px;"></i>
      <h3>Mpay Security</h3>
      <p style="color: var(--muted); font-size: 0.8rem; margin: 6px 0 16px;">Доступ к панели управления</p>
      <input type="password" id="auth-key" class="input" style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;" placeholder="Ключ доступа" />
      <button onclick="loginAdmin()" class="btn btn-accent" style="margin-top: 12px;">Войти</button>
    </div>
  </div>

  <div class="app-card">
    <div class="header">
      <div class="brand"><i class="fa-solid fa-crown"></i> Admin Control</div>
      <span style="font-size: 0.75rem; color: var(--gold); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 12px;">PRO</span>
    </div>

    <main id="admin-dash" class="screen hidden">
      <!-- TERMINALS MANAGEMENT -->
      <div class="box">
        <div class="box-title"><i class="fa-solid fa-server"></i> Мониторинг Терминалов</div>
        <div id="term-list" style="display: flex; flex-direction: column; gap: 8px;">
          <div style="color: var(--muted); font-size: 0.8rem; text-align: center;">Загрузка списка...</div>
        </div>
      </div>

      <!-- CARDS MANAGEMENT -->
      <div class="box">
        <div class="box-title"><i class="fa-solid fa-credit-card"></i> Управление Картами</div>
        <button onclick="createAdminCard()" class="btn btn-gold"><i class="fa-solid fa-infinity"></i> Создать Админ-Карту (∞)</button>
        
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
          <input type="text" id="target-card" class="input" placeholder="Номер карты" />
          <input type="number" id="topup-amt" class="input" placeholder="Сумма (EGP)" />
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button onclick="topupCard()" class="btn btn-glass">Пополнить</button>
            <button onclick="deleteCard()" class="btn btn-danger">Удалить</button>
          </div>
          <button onclick="convertCard()" class="btn btn-glass">Сбросить статус Админа</button>
        </div>
      </div>

      <!-- SECURITY SETTINGS -->
      <div class="box">
        <div class="box-title"><i class="fa-solid fa-key"></i> Секретный Ключ Входа</div>
        <input type="password" id="new-key-input" class="input" placeholder="Новый ключ доступа" />
        <button onclick="changeAdminKey()" class="btn btn-accent">Обновить Ключ</button>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://mpay-4f703-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function loginAdmin() {
      const enteredKey = document.getElementById('auth-key').value.trim();
      try {
        const snap = await db.ref('settings/adminKey').once('value');
        const validKey = (snap.exists() && snap.val()) ? snap.val().toString() : "111";

        if (enteredKey === validKey) {
          document.getElementById('auth-modal').classList.add('hidden');
          document.getElementById('admin-dash').classList.remove('hidden');
          loadTerminals();
        } else {
          alert("Неверный секретный ключ!");
        }
      } catch (e) {
        if (enteredKey === "111") {
          document.getElementById('auth-modal').classList.add('hidden');
          document.getElementById('admin-dash').classList.remove('hidden');
          loadTerminals();
        } else alert("Ошибка авторизации!");
      }
    }

    function loadTerminals() {
      db.ref('terminals').on('value', snap => {
        const list = document.getElementById('term-list');
        list.innerHTML = "";
        if (!snap.exists()) {
          list.innerHTML = `<div style="color:var(--muted); font-size:0.8rem; text-align:center;">Терминалы не найдены</div>`;
          return;
        }
        snap.forEach(child => {
          const t = child.val();
          const isBlocked = t.status === 'blocked';
          list.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);">
              <div>
                <strong style="font-size:0.85rem;">${t.terminalId}</strong>
                <div style="font-size:0.7rem; color:${isBlocked ? 'var(--danger)':'#00ff88'};">[${t.status.toUpperCase()}]</div>
              </div>
              <button onclick="toggleTerm('${t.terminalId}', '${t.status}')" class="btn ${isBlocked ? 'btn-accent':'btn-danger'}" style="width:auto; padding:6px 12px; font-size:0.75rem;">
                ${isBlocked ? 'Разблок.' : 'Заблок.'}
              </button>
            </div>
          `;
        });
      });
    }

    async function toggleTerm(id, curStatus) {
      await db.ref(`terminals/${id}`).update({ status: curStatus === 'blocked' ? 'active' : 'blocked' });
    }

    async function createAdminCard() {
      const num = "9999" + Math.floor(100000000000 + Math.random() * 900000000000);
      await db.ref(`cards/${num}`).set({
        cardNumber: num, pin: "0000", balance: 9999999, isAdminCard: true, isFrozen: false, createdAt: Date.now()
      });
      alert(`Создана бесконечная админ-карта!\nНомер: ${num}\nPIN: 0000`);
    }

    async function topupCard() {
      const num = document.getElementById('target-card').value.replace(/\s+/g, '');
      const amt = parseFloat(document.getElementById('topup-amt').value);
      if (!num || isNaN(amt)) return alert("Заполните данные!");
      
      const snap = await db.ref(`cards/${num}`).once('value');
      if (snap.exists()) {
        const cur = snap.val().balance || 0;
        await db.ref(`cards/${num}`).update({ balance: cur + amt });
        alert("Баланс успешно пополнен!");
      } else alert("Карта не найдена!");
    }

    async function deleteCard() {
      const num = document.getElementById('target-card').value.replace(/\s+/g, '');
      if (!num) return alert("Укажите номер карты!");
      await db.ref(`cards/${num}`).remove();
      alert("Карта удалена!");
    }

    async function convertCard() {
      const num = document.getElementById('target-card').value.replace(/\s+/g, '');
      if (!num) return alert("Укажите номер карты!");
      await db.ref(`cards/${num}`).update({ isAdminCard: false, balance: 0 });
      alert("Карта конвертирована в обычную!");
    }

    async function changeAdminKey() {
      const k = document.getElementById('new-key-input').value.trim();
      if (k) {
        await db.ref('settings/adminKey').set(k);
        alert("Секретный ключ успешно обновлен!");
      }
    }
  </script>
</body>
</html>
