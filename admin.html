<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M Pay Admin Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0c0518;
      --panel: rgba(28, 13, 48, 0.88);
      --border: rgba(168, 85, 247, 0.25);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text: #f1f5f9;
      --muted: #64748b;
      --danger: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-image: radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.15), transparent 60%); }

    .splash-screen {
      position: fixed; inset: 0; background: #0c0518; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: splashFadeOut 0.4s ease-out forwards 3.2s;
    }
    .splash-brand { display: flex; align-items: center; justify-content: center; position: relative; }
    .splash-svg { width: 110px; height: 110px; flex-shrink: 0; overflow: visible; }
    
    .splash-circle {
      fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
      pathLength: 1; stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: drawCircle 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.8s;
    }
    .splash-check {
      fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
      pathLength: 1; stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: drawCheck 0.5s ease forwards 0.3s;
    }
    .splash-pay {
      font-size: 3rem; font-weight: 900; color: #ffffff; white-space: nowrap; overflow: hidden;
      display: inline-block; animation: fadePay 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.2s;
    }
    .splash-sub {
      font-size: 0.85rem; font-weight: 700; color: var(--accent); text-transform: uppercase;
      letter-spacing: 3px; margin-top: 12px; animation: fadeSub 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.2s;
    }

    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes fadePay {
      0% { opacity: 1; max-width: 120px; transform: translateX(0); }
      100% { opacity: 0; max-width: 0px; transform: translateX(-10px); margin: 0; visibility: hidden; }
    }
    @keyframes fadeSub {
      0% { opacity: 0.8; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(5px); visibility: hidden; }
    }
    @keyframes splashFadeOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

    .app-card { width: 100%; max-width: 440px; min-height: 720px; background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 32px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .header { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand { font-weight: 800; font-size: 1.15rem; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

    .screen { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    
    .list-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn { padding: 8px 14px; border-radius: 12px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .btn-danger { background: rgba(255, 51, 102, 0.2); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.4); }
    .btn-main { background: var(--accent); color: #000; }
  </style>
</head>
<body>

  <!-- SPLASH OVERLAY -->
  <div id="splash" class="splash-screen">
    <div class="splash-brand">
      <svg class="splash-svg" viewBox="0 0 100 100">
        <circle class="splash-circle" cx="50" cy="50" r="42" />
        <text x="22" y="66" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="900" fill="var(--accent)">M</text>
        <path class="splash-check" d="M 50 52 L 62 64 L 82 38" />
      </svg>
      <div class="splash-pay">Pay</div>
    </div>
    <div class="splash-sub">Admin Panel</div>
  </div>

  <div class="app-card">
    <div class="header">
      <div class="brand"><i class="fa-solid fa-user-shield"></i> MPAY ADMIN</div>
    </div>

    <main class="screen">
      <h4 style="color: var(--accent); margin-bottom: 5px;">Управление POS Терминалами</h4>
      <div id="terminals-list">Загрузка терминалов...</div>

      <h4 style="color: var(--accent); margin-top: 15px; margin-bottom: 5px;">Управление Картами</h4>
      <div id="cards-list">Загрузка карт...</div>
    </main>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://mpay-4f703-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('terminals').on('value', snap => {
      const el = document.getElementById('terminals-list');
      el.innerHTML = "";
      if (!snap.exists()) return el.innerHTML = `<small style="color:var(--muted)">Нет активных терминалов</small>`;
      
      snap.forEach(child => {
        const t = child.val();
        const isBlocked = t.status === 'blocked';
        el.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${t.terminalId}</strong><br>
              <small style="color:${isBlocked ? 'var(--danger)' : 'var(--accent)'}">${t.status || 'active'}</small>
            </div>
            <button class="btn ${isBlocked ? 'btn-main' : 'btn-danger'}" onclick="toggleTerminal('${t.terminalId}', '${t.status}')">
              ${isBlocked ? 'Разблокировать' : 'Заблокировать'}
            </button>
          </div>
        `;
      });
    });

    db.ref('cards').on('value', snap => {
      const el = document.getElementById('cards-list');
      el.innerHTML = "";
      if (!snap.exists()) return el.innerHTML = `<small style="color:var(--muted)">Нет созданных карт</small>`;

      snap.forEach(child => {
        const c = child.val();
        el.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${c.cardNumber}</strong><br>
              <small style="color:var(--muted)">Баланс: ${c.balance} EGP</small>
            </div>
            <button class="btn ${c.isFrozen ? 'btn-main' : 'btn-danger'}" onclick="toggleCard('${c.cardNumber}', ${c.isFrozen})">
              ${c.isFrozen ? 'Разморозить' : 'Заморозить'}
            </button>
          </div>
        `;
      });
    });

    async function toggleTerminal(id, currentStatus) {
      const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
      await db.ref(`terminals/${id}`).update({ status: newStatus });
    }

    async function toggleCard(num, isFrozen) {
      await db.ref(`cards/${num}`).update({ isFrozen: !isFrozen });
    }
  </script>
</body>
</html>
