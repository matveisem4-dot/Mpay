<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MPay Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #130E26; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1F1735; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2, h3 { color: #A855F7; margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #332754; background: #130E26; color: #fff; box-sizing: border-box; }
    button { background: #A855F7; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #9333EA; }
    button.btn-danger { background: #DC2626; }
    button.btn-danger:hover { background: #B91C1C; }
    button.btn-warning { background: #D97706; }
    .row { display: flex; gap: 10px; }
    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card { background: #2A1F45; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .hidden { display: none; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- Авторизация -->
    <div id="auth-section" class="card">
      <h2>Авторизация Admin</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Пароль">
      <button onclick="login()">Войти</button>
      <p id="auth-error" style="color: #EF4444;"></p>
    </div>

    <!-- Основной интерфейс -->
    <div id="main-section" class="hidden">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>🔑 MPay Admin Panel</h2>
        <button onclick="logout()" style="width: auto; padding: 8px 16px;">Выйти</button>
      </div>

      <!-- Управление Терминалами -->
      <div class="card">
        <h3>Управление POS-Терминалами</h3>
        <div class="item-list" id="terminals-list"></div>
      </div>

      <!-- Управление Картами -->
      <div class="card">
        <h3>Управление Картами</h3>
        <div class="item-list" id="cards-list"></div>
      </div>

      <!-- Управление Магазинами для GPS -->
      <div class="card">
        <h3>Добавить точку магазина (GPS)</h3>
        <input type="text" id="store-name" placeholder="Название магазина">
        <input type="text" id="store-address" placeholder="Адрес">
        <div class="row">
          <input type="number" step="any" id="store-lat" placeholder="Широта (Lat)">
          <input type="number" step="any" id="store-lng" placeholder="Долгота (Lng)">
        </div>
        <input type="text" id="store-image" placeholder="URL фото магазина">
        <button onclick="addStore()">Сохранить точку в GPS</button>

        <h3>Магазины в базе</h3>
        <div class="item-list" id="stores-list"></div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('main-section').classList.add('hidden');
      }
    });

    function login() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(e, p).catch(err => {
        document.getElementById('auth-error').innerText = err.message;
      });
    }

    function logout() { auth.signOut(); }

    function loadData() {
      // Загрузка терминалов
      db.ref('terminals').on('value', snap => {
        const list = document.getElementById('terminals-list');
        list.innerHTML = '';
        if (!snap.exists()) return list.innerHTML = '<p>Нет терминалов</p>';
        snap.forEach(child => {
          const val = child.val();
          const isBlocked = val.status === 'blocked';
          list.innerHTML += `
            <div class="item-card">
              <div>
                <strong>${child.key}</strong> <br>
                <small style="color: ${isBlocked ? '#EF4444' : '#10B981'}">${val.status || 'active'}</small>
              </div>
              <div class="row" style="width: auto;">
                <button class="${isBlocked ? 'btn-warning' : ''}" onclick="toggleTerminal('${child.key}', '${val.status}')">
                  ${isBlocked ? 'Разблокировать' : 'Заблокировать'}
                </button>
                <button class="btn-danger" onclick="deleteTerminal('${child.key}')">Удалить</button>
              </div>
            </div>`;
        });
      });

      // Загрузка карт
      db.ref('cards').on('value', snap => {
        const list = document.getElementById('cards-list');
        list.innerHTML = '';
        if (!snap.exists()) return list.innerHTML = '<p>Нет карт в базе</p>';
        snap.forEach(child => {
          const val = child.val();
          list.innerHTML += `
            <div class="item-card">
              <div>
                <strong>${child.key}</strong> <br>
                <small>Баланс: ${val.balance || 0} ₽</small>
              </div>
              <button class="btn-danger" style="width: auto;" onclick="deleteCard('${child.key}')">Удалить карту</button>
            </div>`;
        });
      });

      // Загрузка магазинов
      db.ref('stores').on('value', snap => {
        const list = document.getElementById('stores-list');
        list.innerHTML = '';
        if (!snap.exists()) return list.innerHTML = '<p>Нет сохраненных магазинов</p>';
        snap.forEach(child => {
          const val = child.val();
          list.innerHTML += `
            <div class="item-card">
              <div>
                <strong>${val.name}</strong> (${val.address})<br>
                <small>Lat: ${val.lat}, Lng: ${val.lng}</small>
              </div>
              <button class="btn-danger" style="width: auto;" onclick="deleteStore('${child.key}')">Удалить</button>
            </div>`;
        });
      });
    }

    function toggleTerminal(id, current) {
      db.ref(`terminals/${id}`).update({ status: current === 'blocked' ? 'active' : 'blocked' });
    }
    function deleteTerminal(id) { db.ref(`terminals/${id}`).remove(); }
    function deleteCard(id) { db.ref(`cards/${id}`).remove(); }
    function deleteStore(id) { db.ref(`stores/${id}`).remove(); }

    function addStore() {
      const name = document.getElementById('store-name').value;
      const address = document.getElementById('store-address').value;
      const lat = parseFloat(document.getElementById('store-lat').value);
      const lng = parseFloat(document.getElementById('store-lng').value);
      const image = document.getElementById('store-image').value;

      if (!name || isNaN(lat) || isNaN(lng)) return alert('Заполните название и координаты!');

      db.ref('stores').push({ name, address, lat, lng, imageUrl: image }, () => {
        document.getElementById('store-name').value = '';
        document.getElementById('store-address').value = '';
        document.getElementById('store-lat').value = '';
        document.getElementById('store-lng').value = '';
        document.getElementById('store-image').value = '';
      });
    }
  </script>
</body>
</html>
