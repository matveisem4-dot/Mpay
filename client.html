<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MPay Client App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS & JS (Спутниковые карты высокого разрешения) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Tesseract.js (Распознавание текста с камеры) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: sans-serif; background: #130E26; color: white; margin: 0; padding: 0; }
    .nav { display: flex; background: #1F1735; padding: 10px; }
    .nav button { flex: 1; padding: 12px; background: none; border: none; color: white; font-weight: bold; border-bottom: 2px solid transparent; }
    .nav button.active { border-bottom-color: #A855F7; color: #A855F7; }
    .tab-content { display: none; padding: 15px; }
    .tab-content.active { display: block; }
    #map { height: 70vh; width: 100%; border-radius: 12px; }
    .empty-state { text-align: center; margin-top: 80px; }
    .empty-state .emoji { font-size: 80px; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; }
    .modal-content { background: #1F1735; padding: 25px; border-radius: 12px; width: 85%; max-width: 400px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #332754; background: #130E26; color: white; box-sizing: border-box; }
    .btn { background: #A855F7; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="nav">
    <button class="active" onclick="switchTab('map-tab')">🗺 GPS Магазины</button>
    <button onclick="switchTab('scan-tab')">📲 Сканер P2P</button>
    <button onclick="switchTab('ocr-tab')">📷 Ввод по Фото</button>
  </div>

  <!-- Вкладка GPS Карта -->
  <div id="map-tab" class="tab-content active">
    <div id="empty-gps" class="empty-state" style="display: none;">
      <div class="emoji">😔</div>
      <h2>Точек пока что нет</h2>
      <p style="color: #aaa;">Подождите, скоро мы добавим новые магазины!</p>
    </div>
    <div id="map"></div>
  </div>

  <!-- Вкладка QR Сканер P2P -->
  <div id="scan-tab" class="tab-content">
    <h3>Сканировать QR-код для перевода</h3>
    <div id="qr-reader" style="width: 100%; border-radius: 12px; overflow: hidden;"></div>
  </div>

  <!-- Вкладка OCR Распознавание Рукописных Цифр -->
  <div id="ocr-tab" class="tab-content">
    <h3>Считать номер карты с обратной стороны</h3>
    <input type="file" id="card-photo" accept="image/*" capture="environment">
    <button class="btn" onclick="processCardPhoto()">Распознать карту</button>
    <p id="ocr-status"></p>
  </div>

  <!-- Модалка Перевода -->
  <div id="transfer-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Перевод средств</h3>
      <p>Получатель: <span id="target-card-display" style="color: #A855F7;"></span></p>
      <input type="number" id="transfer-amount" placeholder="Сумма перевода (₽)">
      <button class="btn" onclick="executeTransfer()">Отправить деньги</button>
      <button class="btn" style="background: #444; margin-top: 8px;" onclick="closeModal()">Отмена</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const myCardId = "CARD_MY_CLIENT_123"; // ID карты текущего пользователя
    let scannedTargetCard = "";
    let map;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'scan-tab') startQrScanner();
      if (tabId === 'map-tab' && map) map.invalidateSize();
    }

    // Инициализация Спутниковой Карты GPS (Пешеходная прорисовка травы/рельефа)
    function initMap() {
      db.ref('stores').on('value', snap => {
        if (!snap.exists()) {
          document.getElementById('empty-gps').style.display = 'block';
          document.getElementById('map').style.display = 'none';
          return;
        }

        document.getElementById('empty-gps').style.display = 'none';
        document.getElementById('map').style.display = 'block';

        if (!map) {
          map = L.map('map').setView([55.7558, 37.6173], 15);
          // Спутниковый слой Esri World Imagery для детального просмотра травы/пешеходных зон
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
          }).addTo(map);
        }

        snap.forEach(child => {
          const s = child.val();
          const marker = L.marker([s.lat, s.lng]).addTo(map);
          marker.bindPopup(`
            <div style="color:#000;">
              ${s.imageUrl ? `<img src="${s.imageUrl}" style="width:100%; border-radius:6px;">` : ''}
              <h4>${s.name}</h4>
              <p>${s.address}</p>
            </div>
          `);
        });
      });
    }

    // P2P QR Сканер
    function startQrScanner() {
      const html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          if (qrCodeMessage.startsWith("mpay://pay?card=")) {
            html5QrCode.stop();
            scannedTargetCard = qrCodeMessage.replace("mpay://pay?card=", "");
            document.getElementById('target-card-display').innerText = scannedTargetCard;
            document.getElementById('transfer-modal').style.display = 'flex';
          }
        }
      );
    }

    function closeModal() { document.getElementById('transfer-modal').style.display = 'none'; }

    function executeTransfer() {
      const amount = parseFloat(document.getElementById('transfer-amount').value);
      if (!amount || amount <= 0) return alert('Введите корректную сумму');

      const senderRef = db.ref(`cards/${myCardId}/balance`);
      const recipientRef = db.ref(`cards/${scannedTargetCard}/balance`);

      senderRef.transaction(current => {
        if ((current || 0) < amount) return; // Отмена транзакции
        return current - amount;
      }, (error, committed) => {
        if (committed) {
          recipientRef.transaction(current => (current || 0) + amount);
          alert('Перевод выполнен!');
          closeModal();
        } else {
          alert('Недостаточно средств');
        }
      });
    }

    // Оптимизированный OCR с фильтрацией рукописного текста и проверкой по алгоритму Луна
    async function processCardPhoto() {
      const fileInput = document.getElementById('card-photo');
      const status = document.getElementById('ocr-status');
      if (!fileInput.files[0]) return alert('Выберите фото');

      status.innerText = 'Анализ рукописного текста...';
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(fileInput.files[0]);
      await worker.terminate();

      // Замена похожих рукописных букв
      let text = ret.data.text
        .replace(/[OoD]/g, '0')
        .replace(/[Il|!]/g, '1')
        .replace(/[SZs]/g, '5')
        .replace(/[B]/g, '8');

      const digits = text.replace(/\D/g, '');
      
      // Проверка алгоритмом Луна
      let validCard = null;
      for (let i = 0; i <= digits.length - 16; i++) {
        let candidate = digits.substring(i, i + 16);
        if (checkLuhn(candidate)) { validCard = candidate; break; }
      }

      if (validCard) {
        status.innerText = `Карта успешно распознана: ${validCard}`;
      } else {
        status.innerText = 'Не удалось разобрать номер карты. Попробуйте переснять.';
      }
    }

    function checkLuhn(cardNo) {
      let s = 0, alt = false;
      for (let i = cardNo.length - 1; i >= 0; i--) {
        let n = parseInt(cardNo[i], 10);
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        s += n; alt = !alt;
      }
      return (s % 10 === 0);
    }

    window.onload = initMap;
  </script>
</body>
</html>
