<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M Pay Client Wallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #050b18;
      --panel: rgba(13, 27, 48, 0.88);
      --border: rgba(0, 136, 255, 0.25);
      --accent: #0088ff;
      --accent-glow: rgba(0, 136, 255, 0.4);
      --text: #f1f5f9;
      --muted: #64748b;
      --danger: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-image: radial-gradient(circle at 50% 10%, rgba(0, 136, 255, 0.15), transparent 60%); }

    /* BLUE SPLASH ANIMATION */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: #050b18;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashFadeOut 0.5s ease forwards 3.5s;
    }
    .splash-content { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .splash-svg { width: 110px; height: 110px; overflow: visible; }
    .splash-check { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawCheck 0.6s ease forwards 0.3s; }
    .splash-circle { stroke-dasharray: 280; stroke-dashoffset: 280; animation: drawCircle 1s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.8s; }
    .splash-text { font-size: 3rem; font-weight: 900; color: #ffffff; white-space: nowrap; overflow: hidden; max-width: 200px; display: flex; align-items: center; animation: erasePayText 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards 1.2s; }
    .splash-sub { font-size: 0.85rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; margin-top: 12px; opacity: 0.8; animation: erasePayText 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards 1.2s; }

    @keyframes drawCheck { 100% { stroke-dashoffset: 0; } }
    @keyframes erasePayText { 0% { max-width: 200px; opacity: 1; } 100% { max-width: 0px; opacity: 0; margin: 0; padding: 0; } }
    @keyframes drawCircle { 100% { stroke-dashoffset: 0; } }
    @keyframes splashFadeOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

    .app-card { width: 100%; max-width: 410px; min-height: 720px; background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 32px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .header { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand { font-weight: 800; font-size: 1.15rem; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

    .screen { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
    .hidden { display: none !important; }

    .virtual-card { width: 100%; height: 180px; background: linear-gradient(135deg, #0055ff, #001a4d); border: 1px solid var(--accent); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 30px var(--accent-glow); margin-bottom: 10px; position: relative; }
    .card-num { font-size: 1.25rem; font-weight: 700; letter-spacing: 2px; }
    .card-bal { font-size: 1.8rem; font-weight: 800; }

    .btn { width: 100%; padding: 14px; border-radius: 16px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; }
    .btn-main { background: linear-gradient(135deg, #0088ff, #0055cc); color: #fff; box-shadow: 0 4px 20px var(--accent-glow); }
    .btn-glass { background: rgba(255, 255, 255, 0.04); color: #fff; border: 1px solid rgba(255,255,255,0.08); }

    .input-group { width: 100%; }
    .input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; text-align: center; }
  </style>
</head>
<body>

  <!-- BLUE SPLASH OVERLAY -->
  <div id="splash" class="splash-screen">
    <div class="splash-content">
      <svg class="splash-svg" viewBox="0 0 100 100">
        <circle class="splash-circle" cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" />
        <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="900" fill="var(--accent)">M</text>
        <path class="splash-check" d="M 52 50 L 64 63 L 84 37" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="splash-text">Pay</div>
    </div>
    <div class="splash-sub">Client Wallet</div>
  </div>

  <div class="app-card">
    <div class="header">
      <div class="brand"><i class="fa-solid fa-wallet"></i> MPAY CLIENT</div>
    </div>

    <main class="screen">
      <div class="virtual-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; opacity: 0.8;">M Pay Digital Card</span>
          <i class="fa-solid fa-wifi" style="color: var(--accent);"></i>
        </div>
        <div>
          <div style="font-size: 0.75rem; color: #94a3b8;">Баланс карт-счета</div>
          <div class="card-bal"><span id="user-bal">1,250.00</span> EGP</div>
        </div>
        <div class="card-num" id="user-card">4400 •••• •••• 8912</div>
      </div>

      <div class="input-group">
        <input type="text" id="bind-card-input" class="input" placeholder="Введите номер карты (4400...)" />
      </div>

      <button onclick="bindUserCard()" class="btn btn-main"><i class="fa-solid fa-link"></i> Привязать карту к аккаунту</button>
      <button onclick="emulateNfcTap()" class="btn btn-glass"><i class="fa-solid fa-mobile-screen-button"></i> Эмулировать NFC оплату</button>
    </main>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://mpay-4f703-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeCardNum = localStorage.getItem('mpay_client_card') || "4400123456788912";

    function updateCardUI(cardNum, bal) {
      document.getElementById('user-card').textContent = cardNum.replace(/(.{4})/g, '$1 ').trim();
      document.getElementById('user-bal').textContent = parseFloat(bal).toFixed(2);
    }

    db.ref(`cards/${activeCardNum}`).on('value', snap => {
      if (snap.exists()) {
        const data = snap.val();
        updateCardUI(data.cardNumber, data.balance);
      }
    });

    async function bindUserCard() {
      const num = document.getElementById('bind-card-input').value.trim();
      if (!num) return alert("Введите номер карты!");
      
      const snap = await db.ref(`cards/${num}`).once('value');
      if (snap.exists()) {
        activeCardNum = num;
        localStorage.setItem('mpay_client_card', num);
        const data = snap.val();
        updateCardUI(data.cardNumber, data.balance);
        alert("Карта успешно привязана!");
      } else alert("Карта не найдена!");
    }

    function emulateNfcTap() {
      alert("NFC Чип смартфона активирован. Поднесите телефон к терминалу.");
    }
  </script>
</body>
</html>
