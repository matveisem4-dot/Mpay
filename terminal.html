<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mpay Terminal POS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #07090e;
      --panel: rgba(15, 23, 36, 0.85);
      --border: rgba(0, 255, 136, 0.2);
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.35);
      --text: #f0f4f8;
      --muted: #64748b;
      --danger: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.08), transparent 70%); }
    
    .app-card { width: 100%; max-width: 400px; min-height: 680px; background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .brand { font-weight: 800; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; border: 1px solid transparent; }
    .st-active { background: rgba(0, 255, 136, 0.1); color: var(--accent); border-color: rgba(0, 255, 136, 0.3); }
    .st-blocked { background: rgba(255, 51, 102, 0.1); color: var(--danger); border-color: rgba(255, 51, 102, 0.3); }

    .screen { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
    .hidden { display: none !important; }

    .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; }
    .btn-main { background: linear-gradient(135deg, #00ff88, #00b862); color: #000; box-shadow: 0 4px 20px var(--accent-glow); }
    .btn-main:active { transform: scale(0.98); }
    .btn-glass { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-glass:active { background: rgba(255, 255, 255, 0.1); }
    .btn-danger { background: rgba(255, 51, 102, 0.15); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.3); }

    .display-amt { text-align: center; font-size: 3rem; font-weight: 800; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); margin: 10px 0; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 auto; width: 100%; }
    .key { height: 60px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #fff; font-size: 1.5rem; font-weight: 700; cursor: pointer; }
    .key:active { background: rgba(255,255,255,0.15); }

    #map { width: 100%; height: 260px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 10px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
    .modal-card { background: #0f1724; border: 1px solid var(--border); border-radius: 24px; padding: 24px; width: 100%; max-width: 320px; text-align: center; }
    .pin-input { width: 100%; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 1.8rem; text-align: center; letter-spacing: 10px; margin: 15px 0; outline: none; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div class="brand"><i class="fa-solid fa-bolt"></i> MPay Terminal</div>
      <div id="term-status" class="status-pill st-active">TERM_SYNC</div>
    </div>

    <!-- MAIN IDLE -->
    <main id="sc-idle" class="screen">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="width: 90px; height: 90px; border-radius: 50%; background: rgba(0,255,136,0.1); border: 2px solid var(--accent); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--accent); box-shadow: 0 0 30px var(--accent-glow);">
          <i class="fa-solid fa-wifi"></i>
        </div>
        <h2>Готов к работе</h2>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 5px;">Выберите способ оплаты или укажите локацию</p>
      </div>

      <button id="nfc-btn" class="btn btn-main"><i class="fa-solid fa-wireless-code"></i> Считать NFC Карту</button>
      <button onclick="goto('sc-amount')" class="btn btn-glass"><i class="fa-solid fa-calculator"></i> Ввести сумму оплаты</button>
      <button onclick="goto('sc-map')" class="btn btn-glass"><i class="fa-solid fa-map-location-dot"></i> Настройка Магазина (GPS)</button>
    </main>

    <!-- KEYPAD AMOUNT -->
    <main id="sc-amount" class="screen hidden">
      <div style="text-align: center; color: var(--muted); font-size: 0.9rem;">Сумма к оплате</div>
      <div class="display-amt"><span id="amount-val">0</span> <small style="font-size: 1rem;">EGP</small></div>
      <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key" style="color: var(--danger)" onclick="press('C')"><i class="fa-solid fa-backspace"></i></button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key" style="background: var(--accent); color:#000" onclick="startPay()"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <button onclick="goto('sc-idle')" class="btn btn-danger" style="margin-top: 10px;">Отмена</button>
    </main>

    <!-- PAY QR SCREEN -->
    <main id="sc-pay" class="screen hidden" style="text-align: center;">
      <div style="color: var(--muted);">Оплата по QR / NFC</div>
      <div class="display-amt" style="font-size: 2.2rem;"><span id="pay-target">0</span> EGP</div>
      <div style="background: #fff; padding: 15px; border-radius: 20px; display: inline-block; margin: 10px auto; box-shadow: 0 0 25px rgba(255,255,255,0.2);">
        <div id="qrcode"></div>
      </div>
      <p style="color: var(--muted); font-size: 0.8rem;"><i class="fa-solid fa-info-circle"></i> Сканируйте QR или поднесите NFC карту</p>
      <button onclick="goto('sc-idle')" class="btn btn-danger" style="margin-top: 15px;">Сбросить транзакцию</button>
    </main>

    <!-- MAP SCREEN -->
    <main id="sc-map" class="screen hidden">
      <h3 style="text-align: center; margin-bottom: 5px;">Локация ТТ</h3>
      <div id="map"></div>
      <button onclick="locate()" class="btn btn-glass"><i class="fa-solid fa-crosshairs"></i> Моя геопозиция</button>
      <button onclick="saveStoreLoc()" class="btn btn-main"><i class="fa-solid fa-cloud-arrow-up"></i> Сохранить GPS</button>
      <button onclick="goto('sc-idle')" class="btn btn-danger">Назад</button>
    </main>
  </div>

  <!-- PIN MODAL (>10 EGP) -->
  <div id="pin-modal" class="modal hidden">
    <div class="modal-card">
      <i class="fa-solid fa-lock" style="font-size: 2rem; color: var(--accent); margin-bottom: 10px;"></i>
      <h3>Подтверждение</h3>
      <p style="color: var(--muted); font-size: 0.8rem; margin-top: 4px;">Сумма превышает 10 EGP. Введите PIN</p>
      <input type="password" id="pin-field" class="pin-input" maxlength="4" placeholder="••••" />
      <button onclick="verifyPinAndPay()" class="btn btn-main">Подтвердить</button>
      <button onclick="closePinModal()" class="btn btn-danger" style="margin-top: 8px;">Отмена</button>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://mpay-4f703-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let TERM_ID = localStorage.getItem('mpay_terminal_id') || ("TERM_" + Math.floor(1000 + Math.random() * 9000));
    localStorage.setItem('mpay_terminal_id', TERM_ID);
    
    let curAmount = 0, pendingCard = null, mapObj = null, markerObj = null;

    db.ref(`terminals/${TERM_ID}`).on('value', snap => {
      const data = snap.val();
      const stEl = document.getElementById('term-status');
      if (data && data.status === 'blocked') {
        stEl.textContent = `${TERM_ID} [ЗАБЛОКИРОВАН]`;
        stEl.className = "status-pill st-blocked";
      } else {
        stEl.textContent = `${TERM_ID} [ACTIVE]`;
        stEl.className = "status-pill st-active";
        if (!data) db.ref(`terminals/${TERM_ID}`).set({ terminalId: TERM_ID, status: 'active', updatedAt: Date.now() });
      }
    });

    function goto(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      if (id === 'sc-map') setTimeout(initMap, 200);
    }

    function press(v) {
      let el = document.getElementById('amount-val');
      if (v === 'C') el.textContent = el.textContent.slice(0, -1) || '0';
      else el.textContent = el.textContent === '0' ? v : el.textContent + v;
      curAmount = parseInt(el.textContent, 10) || 0;
    }

    async function startPay() {
      if (curAmount <= 0) return alert("Укажите сумму!");
      const snap = await db.ref(`terminals/${TERM_ID}`).once('value');
      if (snap.val() && snap.val().status === 'blocked') return alert("Терминал заблокирован администратором!");
      
      document.getElementById('pay-target').textContent = curAmount;
      document.getElementById('qrcode').innerHTML = "";
      new QRCode(document.getElementById('qrcode'), { text: `mpay://pay?termId=${TERM_ID}&amt=${curAmount}`, width: 140, height: 140 });
      goto('sc-pay');
    }

    document.getElementById('nfc-btn').addEventListener('click', async () => {
      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          await ndef.scan();
          alert("NFC считыватель активен. Поднесите карту.");
          ndef.addEventListener("reading", ({ serialNumber }) => handleNfc(serialNumber));
        } catch (e) { alert("Ошибка NFC: " + e.message); }
      } else alert("Web NFC не поддерживается вашим устройством!");
    });

    async function handleNfc(uid) {
      if (document.getElementById('sc-pay').classList.contains('hidden')) return;
      const snap = await db.ref('cards').orderByChild('nfcUid').equalTo(uid).once('value');
      if (!snap.exists()) return alert("Карта не найдена!");
      
      const card = Object.values(snap.val())[0];
      if (card.isFrozen) return alert("Карта заблокирована!");

      pendingCard = card;
      if (curAmount > 10) {
        document.getElementById('pin-modal').classList.remove('hidden');
      } else {
        commitDebit(card);
      }
    }

    function verifyPinAndPay() {
      const pin = document.getElementById('pin-field').value;
      if (pin === pendingCard.pin) {
        closePinModal();
        commitDebit(pendingCard);
      } else alert("Неверный PIN код!");
    }

    function closePinModal() {
      document.getElementById('pin-modal').classList.add('hidden');
      document.getElementById('pin-field').value = "";
    }

    async function commitDebit(card) {
      if (!card.isAdminCard && card.balance < curAmount) return alert("Недостаточно средств!");
      const newBal = card.isAdminCard ? card.balance : (card.balance - curAmount);
      
      await db.ref(`cards/${card.cardNumber}`).update({ balance: newBal });
      await db.ref(`transactions/${Date.now()}`).set({ termId: TERM_ID, card: card.cardNumber, amt: curAmount, ts: Date.now() });
      
      alert("Успешная оплата!");
      curAmount = 0;
      document.getElementById('amount-val').textContent = "0";
      goto('sc-idle');
    }

    function initMap() {
      if (!mapObj) {
        mapObj = L.map('map').setView([30.0444, 31.2357], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
        markerObj = L.marker([30.0444, 31.2357], { draggable: true }).addTo(mapObj);
      }
    }
    function locate() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          const pos = [p.coords.latitude, p.coords.longitude];
          mapObj.setView(pos, 15);
          markerObj.setLatLng(pos);
        });
      }
    }
    function saveStoreLoc() {
      const pos = markerObj.getLatLng();
      db.ref(`terminals/${TERM_ID}`).update({ lat: pos.lat, lng: pos.lng, updatedAt: Date.now() });
      alert("Геопозиция точки сохранена!");
    }
  </script>
</body>
</html>
